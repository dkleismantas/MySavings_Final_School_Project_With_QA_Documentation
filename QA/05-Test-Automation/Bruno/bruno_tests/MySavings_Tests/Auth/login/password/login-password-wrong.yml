info:
  name: login-password-wrong
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/Auth/login"
  body:
    type: json
    data: |-
      {
      "email": "laba@diena.lt",
      "password": "WRONGPASS"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
