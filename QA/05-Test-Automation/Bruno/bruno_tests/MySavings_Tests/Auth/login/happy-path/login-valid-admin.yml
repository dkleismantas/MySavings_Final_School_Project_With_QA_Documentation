info:
  name: login-valid-admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/Auth/login"
  body:
    type: json
    data: |-
      {
      "email": "admin@mysavings.com",
      "password": "Admin123."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar('adminToken', res.body.accessToken)
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.accessToken
      operator: neq
      value: undefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
