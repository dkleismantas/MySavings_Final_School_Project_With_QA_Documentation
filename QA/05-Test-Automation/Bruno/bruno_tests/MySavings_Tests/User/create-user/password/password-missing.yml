info:
  name: password-missing
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/User/create-user"
  body:
    type: json
    data: |-
      {
      "userName": "{{$randomUserName}}",
      "email": "{{$randomEmail}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
