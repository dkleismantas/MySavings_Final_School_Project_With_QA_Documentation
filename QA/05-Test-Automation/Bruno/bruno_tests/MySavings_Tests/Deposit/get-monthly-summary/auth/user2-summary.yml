info:
  name: user2-summary
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/Deposit/monthly-summary"
  auth:
    type: bearer
    token: "{{user2Token}}"

runtime:
  assertions:
    - expression: "res.status "
      operator: eq
      value: "200"
    - expression: Array.isArray(res.body)
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
