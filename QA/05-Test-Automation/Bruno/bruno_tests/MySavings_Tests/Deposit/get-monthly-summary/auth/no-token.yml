info:
  name: no-token
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/Deposit/monthly-summary"
  auth: inherit

runtime:
  assertions:
    - expression: "res.status "
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
