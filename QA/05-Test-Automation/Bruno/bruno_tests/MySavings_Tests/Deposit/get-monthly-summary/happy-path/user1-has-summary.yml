info:
  name: user1-has-summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/Deposit/monthly-summary"
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  assertions:
    - expression: "res.status "
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: gt
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
