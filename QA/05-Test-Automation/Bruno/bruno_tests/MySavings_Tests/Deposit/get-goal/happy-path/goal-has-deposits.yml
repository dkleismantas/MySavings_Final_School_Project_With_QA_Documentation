info:
  name: goal-has-deposits
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/Deposit/goal/{{user1_savingGoalId}}"
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: gt
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
