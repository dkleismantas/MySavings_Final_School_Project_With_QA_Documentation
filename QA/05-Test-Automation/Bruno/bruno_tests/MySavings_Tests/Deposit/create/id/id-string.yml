info:
  name: id-string
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/Deposit/create"
  body:
    type: json
    data: |-
      {
      "savingGoalId": "abc",
      "amount": 10
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
