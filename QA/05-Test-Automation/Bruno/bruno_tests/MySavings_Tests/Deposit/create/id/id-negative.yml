info:
  name: id-negative
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/Deposit/create"
  body:
    type: json
    data: |-
      {
      "savingGoalId": -1,
      "amount": 10
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "[400, 404]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
