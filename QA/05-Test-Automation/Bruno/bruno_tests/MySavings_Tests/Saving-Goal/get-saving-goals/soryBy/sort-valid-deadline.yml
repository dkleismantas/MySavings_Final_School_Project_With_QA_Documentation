info:
  name: sort-valid-deadline
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-saving-goals/?sortBy=Deadline"
  params:
    - name: sortBy
      value: Deadline
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Data is sorted from oldest to newest date", () => {
          const items = res.body;
          expect(items).to.be.an('array');

          for (let i = 0; i < items.length - 1; i++) {
            const currentDate = new Date(items[i].targetDate).getTime();
            const nextDate = new Date(items[i + 1].targetDate).getTime();

            expect(currentDate).to.be.at.most(nextDate,
              `Error at index ${i}: date ${items[i].targetDate} should not be later than ${items[i+1].targetDate}`
            );
          }
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
