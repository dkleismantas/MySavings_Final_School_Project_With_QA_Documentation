info:
  name: sort-valid-amount
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-saving-goals/?sortBy=Amount"
  params:
    - name: sortBy
      value: Amount
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Data is sorted by targetAmount in descending order", () => {
          const items = res.body;
          expect(items).to.be.an('array');

          for (let i = 0; i < items.length - 1; i++) {
            const currentAmount = Number(items[i].targetAmount);
            const nextAmount = Number(items[i + 1].targetAmount);

            expect(currentAmount).to.be.at.least(nextAmount,
              `Error at index ${i}: amount ${items[i].targetAmount} should not be smaller than ${items[i+1].targetAmount}`
            );
          }
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
