info:
  name: targetDateFrom
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-saving-goals?targetDateFrom=2028-01-01T00:00:00Z"
  params:
    - name: targetDateFrom
      value: 2028-01-01T00:00:00Z
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("All goals have targetDate from 2028-01-01", () => {
          const items = res.body;
          expect(items).to.be.an('array');

          const minDate = new Date("2028-01-01T00:00:00Z").getTime();

          items.forEach((item, index) => {
            if (!item.targetDate || item.targetDate.startsWith("0001")) {
              return;
            }

            const itemDate = new Date(item.targetDate).getTime();

            expect(itemDate).to.be.at.least(minDate,
              `Error at index ${index} (ID: ${item.id}): date ${item.targetDate} is earlier than 2028-01-01`
            );
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
