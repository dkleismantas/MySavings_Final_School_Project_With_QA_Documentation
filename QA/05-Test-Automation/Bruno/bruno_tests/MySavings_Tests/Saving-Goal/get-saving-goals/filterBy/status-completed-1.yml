info:
  name: status-completed-1
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-saving-goals?status=1"
  params:
    - name: status
      value: "1"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("All goals are completed (progress >= 1)", () => {
          const items = res.body;
          expect(items).to.be.an('array');

          items.forEach((item, index) => {
            const target = Number(item.targetAmount);

            expect(target).to.be.above(0, `Error at index ${index}: targetAmount cannot be 0 or negative`);

            const progress = Number(item.currentAmount) / target;

            expect(progress).to.be.at.least(1,
              `Error at index ${index} (ID: ${item.id}): progress is ${progress}, should be >= 1`
            );
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
