info:
  name: name-search
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-saving-goals?name=Go"
  params:
    - name: name
      value: Go
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("All goals start with 'Go'", () => {
          const items = res.body;
          expect(items).to.be.an('array');

          items.forEach((item, index) => {
            expect(item.title).to.be.a('string', `Error at index ${index}: title field is not a string`);

            const startsWithGo = item.title.startsWith("Go");

            expect(startsWithGo).to.equal(true,
              `Error at index ${index} (ID: ${item.id}): title '${item.title}' does not start with 'Go'`
            );
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
