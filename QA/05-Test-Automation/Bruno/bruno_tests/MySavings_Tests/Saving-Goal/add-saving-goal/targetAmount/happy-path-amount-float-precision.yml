info:
  name: happy-path-amount-float-precision
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/SavingGoal/add-saving-goal"
  body:
    type: json
    data: |-
      {
      "title": "Goal",
      "targetAmount": 1.9999998,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const rawValue = res.getBody().toString().trim();
        if (rawValue !== "" && !isNaN(rawValue)) {
          bru.setEnvVar("user1_savingGoalId_forDelete", rawValue);
        };
  assertions:
    - expression: res.status
      operator: in
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
