info:
  name: amount-boolean
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/SavingGoal/add-saving-goal"
  body:
    type: json
    data: |-
      {
      "title": "Goal",
      "targetAmount": true,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
