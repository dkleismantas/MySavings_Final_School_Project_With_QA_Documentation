info:
  name: date-invalid-month
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/SavingGoal/add-saving-goal"
  body:
    type: json
    data: |-
      {
      "title": "Goal",
      "targetAmount": 100,
      "targetDate": "2024-13-10T10:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
