info:
  name: invalid-token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/SavingGoal/add-saving-goal"
  body:
    type: json
    data: |-
      {
      "title": "InvalidToken",
      "targetAmount": 100,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth:
    type: bearer
    token: "{{invalidToken}}"

runtime:
  scripts:
    - type: tests
      code: res.status === 401
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
