info:
  name: admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/SavingGoal/add-saving-goal"
  body:
    type: json
    data: |-
      {
      "title": "AdminTry",
      "targetAmount": 100,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const rawValue = res.getBody().toString().trim();
        if (rawValue !== "" && !isNaN(rawValue)) {
          bru.setEnvVar("admin_savingGoalId", rawValue);
        };
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
