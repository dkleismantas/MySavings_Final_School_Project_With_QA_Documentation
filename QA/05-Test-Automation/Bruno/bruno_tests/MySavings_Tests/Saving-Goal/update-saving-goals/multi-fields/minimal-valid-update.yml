info:
  name: minimal-valid-update
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": {{user1_savingGoalId_forDelete}},
      "title": "A",
      "targetAmount": 1,
      "targetDate": "2030-01-01T00:00:00Z"
      }
