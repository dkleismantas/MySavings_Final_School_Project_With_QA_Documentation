info:
  name: maximal-valid-update
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": {{user1_savingGoalId_forDelete}},
      "title": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
      "targetAmount": 999999999,
      "targetDate": "2099-12-31T23:59:59Z"
