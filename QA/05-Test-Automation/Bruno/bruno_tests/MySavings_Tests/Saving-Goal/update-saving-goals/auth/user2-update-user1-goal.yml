info:
  name: user2-update-user1-goal
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": {{user1_savingGoalId}},
      "title": "Hacked Goal 2",
      "targetAmount": 500,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth:
    type: bearer
    token: "{{user2Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
