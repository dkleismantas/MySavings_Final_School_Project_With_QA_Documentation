info:
  name: no-token
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": {{user1_savingGoalId}},
      "title": "Updated Goal",
      "targetAmount": 200,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
