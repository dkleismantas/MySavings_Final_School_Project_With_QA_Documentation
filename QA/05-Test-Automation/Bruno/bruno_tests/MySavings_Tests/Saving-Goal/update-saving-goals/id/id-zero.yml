info:
  name: id-zero
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": 0,
      "title": "Goal",
      "targetAmount": 100,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "[400, 404]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
