info:
  name: id-string
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/SavingGoal/update-saving-goal"
  body:
    type: json
    data: |-
      {
      "id": "abc",
      "title": "Goal",
      "targetAmount": 100,
      "targetDate": "{{$randomDateFuture}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: res.status === 400
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
