info:
  name: valid-user2-own-goal
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-by-id/{{user2_savingGoalId}}"
  auth:
    type: bearer
    token: "{{user2Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{user2_savingGoalId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
