info:
  name: valid-admin-own-goal
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-by-id/{{admin_savingGoalId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{admin_savingGoalId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
