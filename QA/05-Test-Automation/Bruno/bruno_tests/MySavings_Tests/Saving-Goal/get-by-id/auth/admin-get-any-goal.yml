info:
  name: admin-get-any-goal
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/SavingGoal/get-by-id/{{user1_savingGoalId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
