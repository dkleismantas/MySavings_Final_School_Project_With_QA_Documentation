info:
  name: wallet-valid-admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/Wallet"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
