info:
  name: wallet-valid-user1
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/Wallet"
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.totalBalance
      operator: neq
      value: undefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
