info:
  name: invalid-token
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/Wallet"
  auth:
    type: bearer
    token: "{{invalidToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
