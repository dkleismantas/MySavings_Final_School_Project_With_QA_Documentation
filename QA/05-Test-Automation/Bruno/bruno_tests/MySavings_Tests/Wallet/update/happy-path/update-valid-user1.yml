info:
  name: update-valid-user1
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/Wallet/update"
  body:
    type: json
    data: |-
      {
      "newBalance": 1000
      }
  auth:
    type: bearer
    token: "{{user1Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.totalBalance
      operator: neq
      value: undefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
