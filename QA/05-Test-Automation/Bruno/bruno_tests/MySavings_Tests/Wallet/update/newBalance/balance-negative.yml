info:
  name: balance-negative
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/Wallet/update"
  body:
    type: json
    data: |-
      {
      "newBalance": -10
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "[400, 422]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
