info:
  name: balance-boolean
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/Wallet/update"
  body:
    type: json
    data: |-
      {
      "newBalance": true
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
