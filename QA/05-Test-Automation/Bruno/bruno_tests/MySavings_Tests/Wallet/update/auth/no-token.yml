info:
  name: no-token
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/Wallet/update"
  body:
    type: json
    data: |-
      {
      "newBalance": 100
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
